name: Build and publish index search

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test document discovery and data validation
        run: python3 -m unittest discover -s tests -v
      - name: Build search data
        run: python3 build.py
      - name: Test search in Chrome
        run: python3 tests/browser_smoke.py --browser google-chrome
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html app.js index-data.js .nojekyll 要確認一覧.csv _site/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
